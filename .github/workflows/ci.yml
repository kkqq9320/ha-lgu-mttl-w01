name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      # Some tests compare files against Tuo's originals on the tuo branch, which needs the full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  node:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test "tests/js/*.test.mjs"

  lint:
    name: Home Assistant app linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./mttl_w01
