<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MTTL-W01</title>
<link rel="stylesheet" href="dashboard.css">
<script type="module" src="dashboard.mjs"></script>
</head>
<body>
<header class="topbar" lang="en">
  <div class="brand">
    <h1>MTTL-W01</h1>
    <span class="badge badge-demo" id="demo-badge" data-i18n="demo" hidden></span>
    <span class="badge" id="server-badge" data-state="idle"><span class="badge-dot"></span><span data-f="text"></span></span>
    <span class="brand-sub num"><span id="backend-version"></span><span id="online-count"></span></span>
  </div>
  <nav class="tools">
    <button class="tool tool-lock" id="lock-btn" type="button" data-state="locked">
      <svg class="icon icon-locked" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="1.5" fill="currentColor"></rect></svg>
      <svg class="icon icon-unlocked" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 7.7-1.5" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="1.5" fill="currentColor"></rect></svg>
      <span class="lock-labels">
        <span data-label="locked" data-i18n="unlock"></span>
        <span data-label="unlocked" data-i18n="relock"></span>
      </span>
      <span class="lock-view" data-i18n="view_only"></span>
    </button>
    <a class="tool" href="settings.html" data-demo-href="settings.html?demo" data-i18n="settings"></a>
    <a class="tool" href="logs.html" data-demo-href="logview.html?demo" data-i18n="logs"></a>
    <label class="tool tool-select">
      <span class="sr-only" data-i18n="theme"></span>
      <select id="theme-select">
        <option value="auto" data-i18n="theme_auto"></option>
        <option value="dark" data-i18n="theme_dark"></option>
        <option value="light" data-i18n="theme_light"></option>
      </select>
    </label>
    <div class="seg" role="group" id="lang-group">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ko">KR</button>
    </div>
  </nav>
</header>

<section class="summary">
  <article class="panel sum-card" id="sum-mqtt">
    <div class="sum-head"><h2 data-i18n="sum_mqtt"></h2><span class="badge" data-f="badge"><span class="badge-dot"></span><span data-f="badgeText"></span></span></div>
    <dl class="kv sum-body">
      <div><dt data-i18n="mqtt_broker"></dt><dd class="num" data-f="broker"></dd></div>
      <div><dt data-i18n="mqtt_topic"></dt><dd data-f="topic"></dd></div>
      <div><dt data-i18n="mqtt_discovery"></dt><dd data-f="discovery"></dd></div>
    </dl>
    <div class="sum-actions">
      <a class="action" href="settings.html#mqtt" data-demo-href="settings.html?demo#mqtt" data-i18n="open_settings"></a>
      <a class="action" href="logs.html" data-demo-href="logview.html?demo" data-i18n="open_logs"></a>
    </div>
  </article>
  <article class="panel sum-card" id="sum-fw">
    <div class="sum-head"><h2 data-i18n="sum_fw"></h2><span class="badge" data-f="badge"><span class="badge-dot"></span><span data-f="badgeText"></span></span></div>
    <dl class="kv sum-body">
      <div><dt data-i18n="fw_target_label"></dt><dd class="num" data-f="target"></dd></div>
      <div><dt data-i18n="fw_pending_label"></dt><dd class="num" data-f="pending"></dd></div>
      <div><dt data-i18n="fw_ota_host"></dt><dd class="num" data-f="otaHost"></dd></div>
    </dl>
    <div class="sum-actions">
      <a class="action" href="settings.html#firmware" data-demo-href="settings.html?demo#firmware" data-i18n="open_settings"></a>
      <a class="action" href="logs.html" data-demo-href="logview.html?demo" data-i18n="open_logs"></a>
    </div>
  </article>
  <article class="panel sum-card" id="sum-app">
    <div class="sum-head"><h2 data-i18n="sum_app"></h2></div>
    <div class="sum-body qr-body">
      <div class="qr" data-f="qr" role="img"></div>
      <p class="qr-url num" data-f="url"></p>
      <p class="note qr-note"><a href="https://cafe.naver.com/koreassistant/24088" target="_blank" rel="noopener noreferrer" data-i18n="app_by_tuo_link"></a><span data-i18n="app_by_tuo"></span></p>
    </div>
    <div class="sum-actions">
      <a class="action" href="provision-android.apk" download data-i18n="apk_download"></a>
      <a class="action" href="provision.zip" download data-i18n="pc_download"></a>
    </div>
  </article>
</section>

<p class="banner banner-bad" id="action-error" role="alert" hidden></p>

<main class="devices" id="devices"></main>
<p class="empty" id="empty" data-i18n="empty" hidden></p>

<details class="panel hidden-section" id="hidden-section" data-controls="locked" hidden>
  <summary><span data-f="title"></span></summary>
  <div class="hidden-body">
    <p class="note" data-i18n="hidden_note"></p>
    <div class="alert-line" data-f="alert" data-kind="none" role="status">
      <p data-f="alertText"></p>
    </div>
    <div class="hidden-list" data-f="list"></div>
  </div>
</details>

<dialog class="dev-dialog" id="device-dialog" aria-labelledby="dw-title">
  <div class="dw">
    <header class="dw-head">
      <div class="dw-id">
        <h2 id="dw-title" data-i18n="device_settings"></h2>
        <p class="dw-sub num"><b data-f="name"></b> · <span data-f="mac"></span></p>
      </div>
      <span class="badge" data-f="status"><span class="badge-dot"></span><span data-f="statusText"></span></span>
      <button class="icon-btn dw-close" type="button" data-act="dw-close" data-i18n-title="close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2"></path></svg>
      </button>
    </header>
    <p class="note dw-state" data-f="state" hidden></p>

    <section class="dw-section">
      <h3 class="form-sub" data-i18n="card_fw"></h3>
      <dl class="kv">
        <div><dt data-i18n="dw_fw_current"></dt><dd class="num" data-f="fwCurrent"></dd></div>
        <div><dt data-i18n="fw_target_label"></dt><dd class="num" data-f="fwTarget"></dd></div>
      </dl>
      <p class="note" data-f="fwNote" hidden></p>
      <p class="note" data-f="fwPort" hidden></p>
      <div class="job-row" data-f="job" data-tone="warn" data-active="no" hidden>
        <div class="job-head">
          <span class="job-label" data-i18n="dw_job"></span>
          <span class="badge job-state" data-f="jobBadge"><span class="badge-dot"></span><span data-f="jobText"></span></span>
        </div>
        <p class="job-meta num" data-f="jobMeta"></p>
        <p class="job-detail" data-f="jobDetail" hidden></p>
      </div>
      <div class="btn-row" data-f="otaRow">
        <button class="action" type="button" data-act="dw-ota" data-f="ota"></button>
      </div>
      <div class="alert-line" data-f="fwAlert" data-kind="none" role="status">
        <p data-f="fwAlertText"></p>
      </div>
    </section>

    <section class="dw-section">
      <h3 class="form-sub" data-i18n="dw_measure"></h3>
      <div class="form">
        <label class="check"><input type="checkbox" data-f="voltage"><span data-i18n="dw_voltage"></span></label>
        <label class="check"><input type="checkbox" data-f="rssi"><span data-i18n="dw_rssi"></span></label>
        <label class="field">
          <span data-i18n="dw_interval"></span>
          <select class="num" data-f="interval"></select>
        </label>
        <p class="note" data-i18n="dw_measure_note"></p>
      </div>
      <div class="btn-row">
        <button class="action" type="button" data-act="dw-apply" data-f="apply"></button>
      </div>
      <div class="alert-line" data-f="measureAlert" data-kind="none" role="status">
        <p data-f="measureAlertText"></p>
      </div>
    </section>

    <section class="dw-section" data-f="lockSection" hidden>
      <h3 class="form-sub" data-i18n="lock"></h3>
      <dl class="kv">
        <div><dt data-i18n="lock_status"></dt><dd class="num" data-f="lockState"></dd></div>
      </dl>
      <p class="note" data-f="lockStale" hidden></p>
      <p class="note" data-i18n="lock_note"></p>
      <div class="btn-row">
        <button type="button" data-act="dw-reread" data-f="reread"></button>
      </div>
      <div class="alert-line" data-f="lockAlert" data-kind="none" role="status">
        <p data-f="lockAlertText"></p>
      </div>
    </section>
  </div>
</dialog>

<template id="card-tpl">
  <article class="panel card" data-online="on">
    <div class="card-head">
      <div class="name-row">
        <h2 class="name" data-f="title"></h2>
        <input class="name-input" data-f="titleInput" maxlength="64" hidden>
        <button class="icon-btn" type="button" data-act="rename" data-f="renameBtn" data-i18n-title="rename" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"></path></svg>
        </button>
      </div>
      <span class="badge" data-f="status"><span class="badge-dot"></span><span data-f="statusText"></span></span>
    </div>
    <p class="meta num"><span data-f="mac"></span> · FW <span data-f="fw"></span></p>
    <p class="meta num" data-f="seen"></p>
    <div class="notice" data-f="notice" data-kind="none" data-live="no">
      <button class="notice-fw" type="button" data-act="open-window"><span class="notice-dot" aria-hidden="true"></span><span data-f="fwText"></span></button>
      <span class="notice-offline" data-i18n="offline_note"></span>
    </div>
    <dl class="kv stats">
      <div><dt data-i18n="total_power"></dt><dd class="num" data-f="totalW"></dd></div>
      <div><dt data-i18n="total_energy"></dt><dd class="num" data-f="totalKwh"></dd></div>
      <div><dt data-i18n="voltage"></dt><dd class="num" data-f="voltage"></dd></div>
      <div><dt data-i18n="rssi"></dt><dd class="num" data-f="rssi"></dd></div>
    </dl>
    <div class="bulk">
      <button type="button" data-act="all" data-on="1" data-f="allOn" data-i18n="all_on"></button>
      <button type="button" data-act="all" data-on="0" data-f="allOff" data-i18n="all_off"></button>
      <button type="button" data-act="refresh" data-f="refreshBtn" data-i18n="refresh"></button>
    </div>
    <div class="outlets" data-f="outlets"></div>
    <div class="lock" data-f="lock" data-supported="yes" data-synced="yes">
      <div class="lock-line">
        <span class="lock-label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="1.5" fill="currentColor"></rect></svg>
          <span data-i18n="lock"></span>
        </span>
        <span class="lock-state" data-f="lockState"></span>
      </div>
      <div class="lock-bits" lang="en">
        <button type="button" data-act="lock" data-bit="0" data-i18n="lock_all"></button>
        <button type="button" data-act="lock" data-bit="1">1</button>
        <button type="button" data-act="lock" data-bit="2">2</button>
        <button type="button" data-act="lock" data-bit="3">3</button>
        <button type="button" data-act="lock" data-bit="4">4</button>
      </div>
    </div>
    <div class="card-tools">
      <button type="button" data-act="open-window" data-f="settingsBtn" data-i18n="device_settings"></button>
      <button class="hide-btn" type="button" data-act="hide" data-f="hideBtn"></button>
      <span class="tools-note" data-f="hideNote"></span>
    </div>
  </article>
</template>

<template id="hidden-row-tpl">
  <div class="hidden-row">
    <div class="hidden-main">
      <b class="hidden-name" data-f="name"></b>
      <p class="hidden-meta num" data-f="meta"></p>
    </div>
    <div class="hidden-actions">
      <button type="button" data-act="restore" data-f="restore"></button>
      <button class="hide-btn" type="button" data-act="purge" data-f="purge"></button>
    </div>
    <div class="form purge-box" data-f="box" hidden>
      <label class="field">
        <span data-i18n="purge_type"></span>
        <input type="text" data-f="word" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="DELETE">
      </label>
      <div class="btn-row">
        <button class="hide-btn" type="button" data-act="purge-do" data-f="purgeDo"></button>
        <button type="button" data-act="purge-cancel" data-i18n="purge_cancel"></button>
      </div>
    </div>
  </div>
</template>

<template id="outlet-tpl">
  <div class="outlet" data-state="unknown">
    <div class="outlet-title">
      <b class="outlet-name" data-f="name"></b>
      <input class="name-input" data-f="nameInput" maxlength="64" hidden>
      <button class="icon-btn" type="button" data-act="rename-outlet" data-f="renameBtn" data-i18n-title="rename" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"></path></svg>
      </button>
      <span class="lock-mark" data-f="lockMark" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="1.5" fill="currentColor"></rect></svg></span>
    </div>
    <div class="readings">
      <div class="reading"><span data-i18n="power"></span><strong class="num" data-f="w"></strong></div>
      <div class="reading"><span data-i18n="energy"></span><strong class="num" data-f="kwh"></strong></div>
      <div class="reading"><span data-i18n="temp"></span><strong class="num" data-f="temp"></strong></div>
    </div>
    <button class="toggle num" type="button" data-act="power" data-f="toggle"></button>
  </div>
</template>
</body>
</html>
