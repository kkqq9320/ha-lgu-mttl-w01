<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MTTL-W01</title>
<link rel="stylesheet" href="dashboard.css">
<script type="module" src="dashboard.mjs"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>MTTL-W01</h1>
    <span class="demo-badge" id="demo-badge" data-i18n="demo" hidden></span>
    <p class="brand-sub num"><span id="backend-version"></span><span id="online-count"></span></p>
  </div>
  <nav class="tools">
    <button class="tool" id="auth-btn" type="button"></button>
    <a class="tool" href="tuo.html" data-i18n="settings"></a>
    <a class="tool" href="logs.html" data-i18n="logs"></a>
    <label class="tool tool-select">
      <span class="sr-only" data-i18n="theme"></span>
      <select id="theme-select">
        <option value="auto" data-i18n="theme_auto"></option>
        <option value="dark" data-i18n="theme_dark"></option>
        <option value="light" data-i18n="theme_light"></option>
      </select>
    </label>
    <div class="seg" role="group" id="lang-group">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ko">KR</button>
    </div>
  </nav>
</header>

<section class="grid summary">
  <article class="panel sum-card" id="sum-mqtt" data-state="login">
    <h2 data-i18n="sum_mqtt"></h2>
    <p class="sum-value"><span class="dot"></span><span data-f="value"></span></p>
  </article>
  <article class="panel sum-card" id="sum-fw" data-state="login">
    <h2 data-i18n="sum_fw"></h2>
    <p class="sum-value num"><span class="dot"></span><span data-f="value"></span></p>
    <p class="sum-sub" data-f="sub"></p>
  </article>
</section>

<p class="banner" id="guest-banner" data-i18n="guest_note" hidden></p>
<p class="banner banner-bad" id="action-error" role="alert" hidden></p>

<main class="grid devices" id="devices"></main>
<p class="empty" id="empty" data-i18n="empty" hidden></p>

<template id="card-tpl">
  <article class="panel card" data-online="on">
    <div class="card-head">
      <div class="heading">
        <div class="name-row">
          <h2 class="name" data-f="title"></h2>
          <input class="name-input" data-f="titleInput" maxlength="64" hidden>
          <button class="icon-btn" type="button" data-act="rename" data-f="renameBtn" data-i18n-title="rename">✎</button>
        </div>
        <p class="meta num"><span data-f="mac"></span> · FW <span data-f="fw"></span></p>
        <p class="meta num" data-f="ip"></p>
      </div>
      <span class="status"><span class="dot"></span><span data-f="status"></span></span>
    </div>
    <a class="fw-update" data-f="fwUpdate" href="tuo.html" hidden></a>
    <dl class="stats">
      <div><dt data-i18n="total_power"></dt><dd class="num" data-f="totalW"></dd></div>
      <div><dt data-i18n="total_energy"></dt><dd class="num" data-f="totalKwh"></dd></div>
      <div data-f="voltageRow" hidden><dt data-i18n="voltage"></dt><dd class="num" data-f="voltage"></dd></div>
      <div data-f="rssiRow" hidden><dt data-i18n="rssi"></dt><dd class="num" data-f="rssi"></dd></div>
    </dl>
    <p class="note" data-f="note" data-i18n="offline_note" hidden></p>
    <div class="bulk">
      <button type="button" data-act="all" data-on="1" data-f="allOn" data-i18n="all_on"></button>
      <button type="button" data-act="all" data-on="0" data-f="allOff" data-i18n="all_off"></button>
    </div>
    <div class="outlets" data-f="outlets"></div>
    <div class="lock" data-f="lock" data-synced="yes" hidden>
      <span class="lock-label">
        <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"></rect></svg>
        <span data-i18n="lock"></span>
        <span class="lock-state" data-f="lockState"></span>
      </span>
      <div class="lock-bits">
        <button type="button" data-act="lock" data-bit="0" data-i18n="lock_all"></button>
        <button type="button" data-act="lock" data-bit="1">1</button>
        <button type="button" data-act="lock" data-bit="2">2</button>
        <button type="button" data-act="lock" data-bit="3">3</button>
        <button type="button" data-act="lock" data-bit="4">4</button>
      </div>
    </div>
  </article>
</template>

<template id="outlet-tpl">
  <div class="outlet" data-state="unknown">
    <div class="outlet-title">
      <button class="icon-btn" type="button" data-act="rename-outlet" data-f="renameBtn" data-i18n-title="rename">✎</button>
      <b class="outlet-name" data-f="name"></b>
      <input class="name-input" data-f="nameInput" maxlength="64" hidden>
      <span class="lock-mark" data-f="lockMark" hidden><svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"></path><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"></rect></svg></span>
    </div>
    <div class="readings">
      <div class="reading"><span data-i18n="power"></span><strong class="num" data-f="w"></strong></div>
      <div class="reading"><span data-i18n="energy"></span><strong class="num" data-f="kwh"></strong></div>
      <div class="reading"><span data-i18n="temp"></span><strong class="num" data-f="temp"></strong></div>
    </div>
    <button class="toggle num" type="button" data-act="power" data-f="toggle"></button>
  </div>
</template>

<dialog class="panel login" id="login-dialog">
  <form id="login-form">
    <h2 data-i18n="login_title"></h2>
    <p class="muted" id="login-demo-note" data-i18n="login_demo_note" hidden></p>
    <label class="field"><span data-i18n="password"></span><input type="password" name="password" autocomplete="current-password" required></label>
    <p class="login-error" id="login-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="login-cancel" data-i18n="cancel"></button>
      <button type="submit" class="primary" data-i18n="login"></button>
    </div>
  </form>
</dialog>
</body>
</html>
